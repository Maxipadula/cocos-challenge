services:
  postgres:
    image: postgres:17
    container_name: cocos-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cocos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cocos}
      POSTGRES_DB: ${POSTGRES_DB:-cocos}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
